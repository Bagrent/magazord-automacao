[project]
name = "magazord-automacao"
version = "0.1.0"
description = "Batch product upload automation for the Magazord platform, driven by an Excel sheet."
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# Catalogue generation draws the pages with Pillow. The uploader itself does
# not need it, so it stays out of the base install.
catalogo = ["Pillow>=10.0"]
dev = ["pytest>=8.0", "respx>=0.21", "Pillow>=10.0"]

[project.scripts]
magazord = "magazord_automacao.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
magazord_automacao = ["catalogo/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
